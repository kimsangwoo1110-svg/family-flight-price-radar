<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>가족 항공권 가격 레이더</title><style>body{font:16px system-ui,sans-serif;background:#f3f6fb;color:#20304a;margin:0;padding:24px}main{max-width:900px;margin:auto}.card{background:white;border:1px solid #e1e7f0;border-radius:18px;padding:20px;margin:14px 0}h1{margin:4px 0}small,.hint{color:#66758d}label{display:grid;gap:5px;font-size:13px;color:#596a83}input,select,button{font:inherit;padding:10px;border:1px solid #dce3ed;border-radius:10px}button{cursor:pointer;background:#eef3ff;color:#2959ca;border:0;font-weight:650}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.price{display:flex;gap:10px;margin:12px 0}.row{padding:10px 2px;border-bottom:1px solid #edf0f4;display:flex;justify-content:space-between;gap:8px}.danger{background:#f3f4f6;color:#596a83}</style></head><body><main><header><small>가족 여행 · 항공권 가격 기록</small><h1>✈ 보홀 · 나트랑 항공권 레이더</h1><p class="hint">부산 출발 기본 · 운임을 확인할 때마다 기록해 날짜별 가격 흐름을 보세요.</p></header><section class="card"><h2>여행 일정</h2><div class="price"><button class="preset" data-a="2027-11-24" data-b="2027-11-28">11월 24–28일</button><button class="preset" data-a="2027-12-01" data-b="2027-12-05">12월 1–5일</button></div><div class="grid"><label>출발지 공항 코드<input id="origin" value="PUS" maxlength="3"></label><label>목적지<select id="dest"><option value="TAG">보홀 (TAG)</option><option value="CXR">나트랑 (CXR)</option></select></label><label>출발일<input id="depart" type="date" value="2027-11-24"></label><label>귀국일<input id="return" type="date" value="2027-11-28"></label><label>앞뒤 날짜 여유<select id="offset"><option value="0">기준 날짜</option><option value="1">±1일</option><option value="2">±2일</option><option value="3">±3일</option></select></label></div><p id="range" class="hint"></p><button id="search">항공권 검색</button></section><section class="card"><h2>가격 기록</h2><p class="hint">검색 후 확인한 왕복 총액을 입력하면 선택한 여행 날짜와 확인 날짜가 함께 저장됩니다.</p><div class="grid"><label>왕복 총액 (원)<input id="amount" type="number" min="1" placeholder="예: 1500000"></label><label>가격 확인 날짜<input id="checked" type="date"></label></div><p style="margin-top:12px"><button id="add">가격 저장</button></p><div id="history"></div></section><section class="card"><h2>다른 기기에서 이어보기</h2><p class="hint">같은 이메일로 로그인하면 가격 기록이 동기화됩니다.</p><div class="grid"><label>이메일<input id="email" type="email"></label><label>비밀번호<input id="password" type="password" autocomplete="current-password"></label></div><p style="display:flex;gap:8px;flex-wrap:wrap"><button id="login">로그인</button><button id="signup">계정 만들기</button><button class="danger" id="logout">로그아웃</button></p><div id="status" class="hint">연결 중…</div></section><footer class="hint">여행자: 성인 3명 + 만 2세 미만 유아 1명(무릎 좌석 기준). 좌석·수하물 포함 조건 및 유아 운임은 예약 단계에서 확인하세요. 항공권 운임은 자동 수집되지 않습니다.</footer></main><script>
const URL="https://ityqfqbrtdxpojoigqgw.supabase.co",KEY="sb_publishable_auoSyU1MoRXrod-LKzrH5Q_4z5Ck3xV";let session=JSON.parse(localStorage.getItem("radarSession")||"null"),user=session&&session.user,items=JSON.parse(localStorage.getItem("radar")||"[]");async function api(path,options){options=options||{};let headers=Object.assign({apikey:KEY,"Content-Type":"application/json"},options.headers||{});if(session&&session.access_token)headers.Authorization="Bearer "+session.access_token;let res=await fetch(URL+path,Object.assign({},options,{headers:headers})),body=await res.json().catch(()=>({}));if(!res.ok)throw Error(body.msg||body.message||JSON.stringify(body));return body}const $=s=>document.querySelector(s),shift=(s,n)=>{let d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)},route=()=>[$("origin").value.toUpperCase(),$("dest").value,shift($("depart").value,+$("offset").value),shift($("return").value,+$("offset").value)].join("-");function draw(){let a=shift($("depart").value,+$("offset").value),b=shift($("return").value,+$("offset").value);$("range").textContent="검색 기준: "+a+" – "+b+" · 날짜를 직접 바꾸거나 여유폭을 선택할 수 있습니다.";let list=items.filter(x=>x.route===route()).slice().reverse();$("history").innerHTML=list.length?list.map(x=>'<div class="row"><span>여행 '+x.depart+' → '+x.back+'<br>확인 '+x.checked+'</span><b>₩'+Number(x.price).toLocaleString("ko-KR")+'</b></div>').join(""):'<p class="hint">선택 일정의 기록이 없습니다.</p>'}function save(){localStorage.setItem("radar",JSON.stringify(items));if(user)sync()}async function sync(){if(!user)return;$("status").textContent="클라우드 동기화 중…";try{await api("/rest/v1/trip_radar?on_conflict=user_id",{method:"POST",headers:{Prefer:"resolution=merge-duplicates"},body:JSON.stringify({user_id:user.id,data:{items:items}})});$("status").textContent="동기화 완료 · "+user.email}catch(e){$("status").textContent="저장 오류: "+e.message}}async function load(){try{let rows=await api("/rest/v1/trip_radar?select=data&user_id=eq."+encodeURIComponent(user.id));if(rows.length&&rows[0].data&&Array.isArray(rows[0].data.items)){items=rows[0].data.items;localStorage.setItem("radar",JSON.stringify(items));draw()}else await sync();$("status").textContent="동기화 완료 · "+user.email}catch(e){$("status").textContent="불러오기 오류: "+e.message}}document.querySelectorAll(".preset").forEach(b=>b.onclick=()=>{$("depart").value=b.dataset.a;$("return").value=b.dataset.b;draw()});["origin","dest","depart","return","offset"].forEach(id=>$("#"+id).onchange=draw);$("search").onclick=()=>{let q="Google Flights round trip "+$("origin").value+" to "+$("dest").value+" "+shift($("depart").value,+$("offset").value)+" return "+shift($("return").value,+$("offset").value)+" 3 adults 1 infant";open("https://www.google.com/search?q="+encodeURIComponent(q),"_blank","noopener")};$("add").onclick=()=>{let v=Number($("amount").value);if(!v)return alert("왕복 총액을 입력해 주세요.");items.push({route:route(),depart:shift($("depart").value,+$("offset").value),back:shift($("return").value,+$("offset").value),checked:$("checked").value||new Date().toISOString().slice(0,10),price:v});save();$("amount").value="";draw()};$("login").onclick=async()=>{try{session=await api("/auth/v1/token?grant_type=password",{method:"POST",body:JSON.stringify({email:$("email").value,password:$("password").value})});user=session.user;localStorage.setItem("radarSession",JSON.stringify(session));await load()}catch(e){$("status").textContent="로그인 실패: "+e.message}};$("signup").onclick=async()=>{try{let data=await api("/auth/v1/signup",{method:"POST",body:JSON.stringify({email:$("email").value,password:$("password").value})});if(data.access_token){session=data;user=data.user;localStorage.setItem("radarSession",JSON.stringify(session));await load()}else $("status").textContent="가입 확인 메일을 확인한 다음 로그인하세요."}catch(e){$("status").textContent="가입 실패: "+e.message}};$("logout").onclick=()=>{session=null;user=null;localStorage.removeItem("radarSession");$("status").textContent="로그아웃됨 · 이 기기에 저장된 기록은 유지됩니다."};$("checked").value=new Date().toISOString().slice(0,10);draw();if(user)load();else $("status").textContent="로그인 전 · 이 기기에만 저장 중";
</script></body></html>
